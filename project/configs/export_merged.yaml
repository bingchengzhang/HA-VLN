# 把 LoRA 合并回原版权重，得到一个可以直接用 vLLM 起服务的完整模型：
#   llamafactory-cli export configs/export_merged.yaml
# 之后：MODEL_DIR=Qwen2.5-VL-7B-nav bash scripts/serve_vlm.sh（served-model-name 仍是 qwen-vl，智能体配置不用改）
model_name_or_path: /weights/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: /workspace/lora/nav
template: qwen2_vl
finetuning_type: lora
trust_remote_code: true
export_dir: /weights/Qwen2.5-VL-7B-nav
export_size: 4
export_device: cpu
export_legacy_format: false
